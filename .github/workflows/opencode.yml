# `/oc` работает в issue, в общем обсуждении PR и в построчных комментариях.
# Бюджет попыток считается только для PR; на обычных issue лимита нет.
name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Маркер в имени запуска связывает запуски с PR или issue. История Actions и
# `run_attempt` — источник счётчика для PR: токен агента не может её
# переписать, а текст комментария на бюджет не влияет.
run-name: "opencode-${{ (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null) && 'pr' || 'issue' }}-${{ github.event.pull_request.number || github.event.issue.number }}"

# Один запуск на PR за раз; следующие ждут, а не отменяют текущий.
concurrency:
  group: opencode-pr-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

# По умолчанию не выдаём ничего; каждое задание просит только нужное.
permissions: {}

jobs:
  # Проверка бюджета до вызова модели. Считает уже совершённые попытки по
  # истории Actions и решает, допускать ли текущий запрос.
  budget:
    if: >-
      (startsWith(github.event.comment.body, '/oc') ||
       startsWith(github.event.comment.body, '/opencode')) &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Чтение истории запусков workflow — единственный источник счётчика.
      actions: read
      # Голова PR на момент запроса — для отчёта.
      pull-requests: read
    outputs:
      allowed: ${{ steps.budget.outputs.allowed }}
      pr: ${{ steps.budget.outputs.pr }}
      sha: ${{ steps.budget.outputs.sha }}
    steps:
      - name: Count attempts from Actions history
        id: budget
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          IS_PR: ${{ github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_ATTEMPT: ${{ github.run_attempt }}
          LIMIT: "3"
          WORKFLOW: "opencode.yml"
        run: |
          set -euo pipefail
          # Бюджет — только для PR. На обычном issue команда работает без лимита.
          if [ "${IS_PR}" != "true" ]; then
            {
              echo "allowed=true"
              echo "pr=${PR}"
              echo "sha="
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          marker="opencode-pr-${PR}"
          gh api --paginate \
            "repos/${REPO}/actions/workflows/${WORKFLOW}/runs?per_page=100" \
            --jq '.workflow_runs[] | [(.id|tostring), (.run_attempt|tostring), .status, (.conclusion // ""), (.display_title // "")] | @tsv' \
            > /tmp/opencode-runs.tsv

          # Складываем run_attempt всех завершённых попыток этого PR, кроме
          # текущего запуска. Пропущенные запуски (не команда /oc или не
          # доверенный автор) не тратят бюджет. Attempt текущего запуска
          # учитывается через run_attempt - 1, поэтому Re-run тоже расходует
          # попытку. Отмена и таймаут попадают в историю как completed.
          prior="$(awk -F '\t' -v cur="${CURRENT_RUN_ID}" -v marker="${marker}" '
            $5 == marker {
              if ($1 == cur) next
              if ($3 == "completed" && $4 != "skipped") prior += $2
            }
            END { print prior + 0 }
          ' /tmp/opencode-runs.tsv)"
          prior=$((prior + CURRENT_ATTEMPT - 1))
          sha="$(gh api "repos/${REPO}/pulls/${PR}" --jq .head.sha 2>/dev/null || true)"

          {
            echo "pr=${PR}"
            echo "sha=${sha}"
            if [ "${prior}" -lt "${LIMIT}" ]; then
              echo "allowed=true"
            else
              echo "allowed=false"
            fi
          } >> "${GITHUB_OUTPUT}"

  # Вызов модели. Запускается, только если бюджет не исчерпан.
  opencode:
    needs: budget
    if: needs.budget.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OpenCode exchanges the OIDC token for a scoped GitHub App token
    outputs:
      reason: ${{ steps.record.outputs.reason }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # Отсутствие ключа — это infra, а не ошибка агента.
      - name: Check model credentials
        id: preflight
        env:
          DEEPSEEK_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "OPENCODE_API_KEY is missing" >&2
            exit 1
          fi

      - name: Run OpenCode
        id: model
        uses: anomalyco/opencode/github@17b79f4e0c16dcff200b0417567ed22aeb2d7166 # github-v1.2.28
        env:
          DEEPSEEK_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          VERSION: 1.19.6 # pin the OpenCode 1 binary installed by the action
          # Workflow files are human-managed: the OpenCode App has no
          # `workflows` permission. Deny edit-tool writes there; the App
          # permission remains the hard stop for any push.
          OPENCODE_CONFIG_CONTENT: |-
            {
              "permission": {
                "external_directory": {
                  "/tmp/*": "allow",
                  "/home/runner/work/*": "allow"
                },
                "edit": {
                  "*": "allow",
                  ".github/workflows/*": "deny"
                }
              }
            }
        with:
          model: deepseek/deepseek-flash

      # Классифицируем исход без модели: infra (нет ключа или не установился
      # инструмент) против agent_failed (агент запустился и упал).
      - name: Record outcome
        id: record
        if: always()
        env:
          MODEL_OUTCOME: ${{ steps.model.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
        run: |
          set -euo pipefail
          if [ "${PREFLIGHT_OUTCOME}" != "success" ]; then
            reason="infra"
          elif [ "${MODEL_OUTCOME}" = "success" ]; then
            reason=""
          elif [ ! -x "${HOME}/.opencode/bin/opencode" ]; then
            reason="infra"
          else
            reason="agent_failed"
          fi
          {
            echo "result=${MODEL_OUTCOME}"
            echo "reason=${reason}"
          } >> "${GITHUB_OUTPUT}"

  # Итог публикует отдельное задание без модели. Человек сам решает, что
  # делать дальше; автоматического цикла исправлений нет.
  report:
    needs: [budget, opencode]
    if: >-
      always() &&
      (github.event_name == 'pull_request_review_comment' ||
       github.event.issue.pull_request != null) &&
      needs.budget.result == 'success' &&
      (needs.budget.outputs.allowed != 'true' || needs.opencode.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Комментарий-отчёт и метка ready-for-human на PR.
      issues: write
      pull-requests: write
    steps:
      - name: Publish outcome
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.budget.outputs.pr }}
          SHA: ${{ needs.budget.outputs.sha }}
          BUDGET_ALLOWED: ${{ needs.budget.outputs.allowed }}
          OPENCODE_RESULT: ${{ needs.opencode.result }}
          OPENCODE_REASON: ${{ needs.opencode.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ "${BUDGET_ALLOWED}" != "true" ]; then
            reason="limit_exhausted"
            title="Лимит запусков агента для этого PR исчерпан"
            advice="Бюджет — 3 попытки на один PR. Вызов модели не выполнялся. Автоматический повтор не запускается: следующее действие выбирает человек."
          elif [ "${OPENCODE_RESULT}" = "cancelled" ]; then
            reason="timeout"
            title="Вызов агента не завершился вовремя"
            advice="Вызов отменён по таймауту. Следующее действие выбирает человек."
          elif [ "${OPENCODE_RESULT}" = "failure" ] && [ -z "${OPENCODE_REASON}" ]; then
            # Задание исчерпало timeout-minutes: шаг с исходом не успел записать причину.
            reason="timeout"
            title="Вызов агента не завершился вовремя"
            advice="Вызов отменён по таймауту. Следующее действие выбирает человек."
          elif [ "${OPENCODE_REASON}" = "infra" ]; then
            reason="infra"
            title="Не удалось подготовить запуск агента"
            advice="Не хватает ключа OPENCODE_API_KEY или не установился инструмент. Следующее действие выбирает человек."
          else
            reason="agent_failed"
            title="Запуск агента завершился ошибкой"
            advice="Агент запустился, но завершился ошибкой. Следующее действие выбирает человек."
          fi

          sha="${SHA}"
          [ -n "${sha}" ] || sha="$(gh api "repos/${REPO}/pulls/${PR}" --jq .head.sha 2>/dev/null || true)"
          [ -n "${sha}" ] || sha="недоступен"

          # Сначала отчёт: метка не должна помешать публикации причины.
          body="$(printf "%s\n\n- Причина: \`%s\`\n- Последний SHA: \`%s\`\n- Логи: %s\n- Статус: нужен человек (метка \`ready-for-human\`)\n\n%s\n" \
            "${title}" "${reason}" "${sha}" "${RUN_URL}" "${advice}")"
          gh pr comment "${PR}" --body "${body}"

          if ! gh label list --limit 100 --json name --jq '.[].name' | grep -qx 'ready-for-human'; then
            gh label create ready-for-human \
              --description "Для реализации нужен человек" \
              --color 0E8A16 || true
          fi
          gh pr edit "${PR}" --add-label ready-for-human
