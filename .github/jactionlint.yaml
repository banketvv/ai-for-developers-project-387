# yaml-language-server: $schema=https://raw.githubusercontent.com/jdx/jactionlint/main/schema/jactionlint-config.json
profile: default

ignores:
  - rule: dangerous-triggers
    file: .github/workflows/opencode.yml
    reason: issue_comment is the feature; the job runs only for /oc comments from OWNER, MEMBER or COLLABORATOR
    expires: "2027-05-22"
  - rule: excessive-permissions
    file: .github/workflows/opencode.yml
    reason: id-token is required to exchange an OIDC token for the scoped OpenCode App token
    expires: "2027-05-22"
